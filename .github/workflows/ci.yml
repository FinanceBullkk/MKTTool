name: CI

on:
  push:
    branches: [master, main]
    paths-ignore: &docs-only
      # Documentation cannot fail this suite, and paying for it to try is the single largest
      # avoidable line in this repository's Actions bill: 24 of the last 60 commits on master
      # changed nothing but Markdown, and each one cost a pull-request run plus a post-merge run,
      # including the Windows job that bills at the 2x rate.
      #
      # This is narrower than the `paths:` filter deliberately refused on `relay-executable` below,
      # and the distinction is the whole argument. That one would have run the job ONLY for changes
      # under `relay/`, which rebuilds the blind spot F4 exposed, because the suite imports from
      # `src/lib/crypto`, `src/lib/tickets` and `src/lib/relay`. This one skips a run only when
      # EVERY changed file is documentation — a commit touching one `.md` and one `.ts` still runs
      # everything. No test reads repository documentation; the only `.md` a test touches is a
      # `summary.md` fixture it writes itself.
      #
      # One coupling, stated rather than discovered later: this is safe partly because no required
      # status check is enforced (branch protection is off by owner decision, and both repositories
      # return 403 for it). If protection is ever enabled, revisit — a workflow that never runs
      # publishes no check, which is the failure mode `pr-release-gate.yml` in the Browser
      # repository exists to avoid.
      - "**.md"
      - "docs/**"
      - "plans/**"
  pull_request:
    paths-ignore: *docs-only

jobs:
  check:
    runs-on: ubuntu-latest

    # Bộ test cần một Postgres THẬT, không giả lập được.
    # GitHub-hosted Ubuntu runners provide Docker, which job services need to run their containers.
    #
    # Lý do đầy đủ ở `vitest.global-setup.ts`, tóm tắt: tầng `rule-context-queries.ts` chỉ gồm
    # truy vấn Prisma. Giả lập Prisma chỉ chứng minh được "mình gọi hàm đúng như mình nghĩ",
    # không chứng minh được truy vấn LỌC ĐÚNG — mà lọc sai chính là kiểu hỏng nguy hiểm nhất
    # ở đây: bộ luật im lặng cho qua thay vì báo lỗi.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          # Database phải TỒN TẠI SẴN — global setup dựng bảng bên trong nó, không tự tạo
          # database. Tên bắt buộc kết thúc bằng `_test`: `assertIsTestDatabase()` từ chối chạy
          # trên tên khác, vì mỗi lượt chạy đều `DROP SCHEMA public CASCADE`.
          POSTGRES_DB: mkttool_test
        ports:
          - 5432:5432
        # Không có health check thì các bước sau bắt đầu trước lúc Postgres nghe được, và nó
        # đỏ theo kiểu "connection refused" ngẫu nhiên — dạng chập chờn dạy người đọc quen với
        # việc bấm chạy lại.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Giá trị giả, chỉ để build/test chạy được. KHÔNG có credential thật nào trong CI:
      # database ở đây do chính workflow dựng lên trong runner, không phải kho danh tính.
      #
      # DATABASE_URL cố ý trỏ vào database `postgres` mặc định, KHÔNG dùng chung `mkttool_test`:
      # bộ test xóa sạch schema lúc dọn dẹp, nên dùng chung thì bước `build` chạy sau lại nhìn
      # vào một cái vỏ rỗng.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mkttool_test"
      VAULT_KEY_SERVER: "27112efee5aeaa94963b0f1f9e0dabcdf2767c34ee483d8dc2c76f61bdd1186d"
      VAULT_KEY_OPERATOR: "a3d1e1576b7746dbd4481fb6fd16b16f7c7381301b8ab9ef8a3f2994c96150dc"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Prisma Client phải sinh trước typecheck — nếu không, mọi lời gọi prisma.* đều đỏ.
      - run: npm run db:generate

      # Áp migration bằng chính lệnh sẽ chạy lúc phát hành (GĐ5), chứ không phải đường vòng.
      # Global setup của test áp từng file SQL bằng tay để không phụ thuộc Prisma CLI — đường
      # khác, nên nó không bắt được migration mà CLI từ chối. Bước này bắt.
      # Kèm theo, nó cho `next build` một schema thật thay vì một database rỗng.
      - run: npx prisma migrate deploy

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Sàn coverage đường trọng yếu. Xem `vitest.config.mts` để biết module nào được bảo vệ và
      # vì sao. Một hợp đồng không được lệnh nào gọi thì không tồn tại.
      - run: npm run test:critical-coverage

      - run: npm run build

  # The new database contracts need Node 22 and a real disposable PostgreSQL service. The
  # preflight is intentionally fail-closed: if the runner cannot provision Node 22,
  # the helper records BLOCKED instead of silently running the probe under another runtime or a
  # mock database.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        # Pin the contract service; this is the real-Postgres lane from Phase 2, separate from the
        # broader application check above (which remains on the repository's PostgreSQL 17 image).
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only disposable service credentials. They are not production credentials and are never
      # passed on a command line; the contracts runner forwards them only to child processes.
      # Prisma runs during `npm ci`/postinstall and requires DATABASE_URL even though the contract
      # helper receives its dedicated connection through CONTRACTS_DATABASE_URL.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      CONTRACTS_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Provision Node 22
        id: node22
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 22
          cache: npm

      # Keep the executable selected by setup-node explicit. A runner shell may not
      # carry the action-managed PATH into a later `if: always()` step; falling back to the machine
      # default would make the Node-22 contract silently run under another runtime.
      - name: Capture Node 22 executable
        id: node22_path
        if: steps.node22.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node_bin="$(command -v node)"
          test -x "$node_bin"
          echo "NODE22_BIN=$node_bin" >> "$GITHUB_ENV"

      - name: Install dependencies for the Node 22 contract run
        id: contracts_install
        if: steps.node22_path.outcome == 'success'
        run: npm ci

      - name: Run real PostgreSQL restore and rate-limit contracts
        if: steps.contracts_install.outcome == 'success'
        env:
          PSQL_PATH: ${{ github.workspace }}/scripts/ci/psql-docker-wrapper.sh
        run: |
          "$NODE22_BIN" scripts/ci/run-postgres-contracts.cjs

      - name: Record an unavailable Node 22 contract environment
        if: steps.node22_path.outcome != 'success' || steps.contracts_install.outcome != 'success'
        shell: bash
        run: |
          {
            echo '### CI gate: mkttool-postgres-contracts'
            echo
            echo '- **Status:** `BLOCKED`'
            echo '- **Reason:** Node 22 provisioning or dependency installation did not complete; the real PostgreSQL contract was not substituted.'
            echo '- **Owner:** mkttool-ci'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Scan the source/evidence trees without printing matched values. `plans/` is workspace-level and
  # may not be present in a repository-only checkout; the scanner records that scope explicitly.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan source and evidence for high-confidence secrets
        run: node scripts/ci/secret-scan.cjs --root=plans --root=src --root=relay --root=scripts --root=.github

  # Fail on published advisories against what this app actually ships.
  #
  # Why this job exists - 4 September 2026. Three high-severity advisories landed against
  # `fast-uri`, which arrives here through `ajv` as a production dependency. Nothing in this
  # repository noticed. They surfaced only because the sibling MKTBrowser repository runs the
  # equivalent gate, its `main` went red on an unchanged tree, and checking whether the same
  # dependency was pinned here showed the identical vulnerable version. A gate only one of two
  # repositories has is a gate that reports on one of two repositories.
  #
  # Why `--omit=dev`: a dev-only advisory cannot reach an operator through the deployed app, and
  # blocking merges on one trains people to bypass the gate. Production reach is the line.
  #
  # Expect this job to fail sometimes with no commit causing it: advisories are published against
  # code that already merged. That is the job working, not breaking. Fix by upgrading the
  # dependency, not by lowering `--audit-level`.
  #
  # No `npm ci` step: `npm audit` reads `package-lock.json` and needs no installed tree.
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail on high-severity advisories in production dependencies
        run: npm run audit:production

  # Acceptance-test the packaged Relay `.exe` itself, not its source.
  #
  # Why this job exists — C37, 17 August 2026. F4 made `/encrypt-for-vault` require the trusted
  # `Origin`; `scripts/smoke-test-relay-executable.ts` was never updated to send one, so its two
  # sealing calls had been failing for days and nobody saw it, because this suite had never run
  # anywhere except by hand. It surfaced only because Relay 13 happened to be verified before
  # publishing. The findings register recorded that as un-automatable; that was wrong, and this job
  # is the correction.
  #
  # Why it needs no secrets: the suite mints a throwaway `TICKET_SIGNING_KEY` and a per-run
  # operator vault key (`smoke-test-relay-executable.ts:68,82`), runs the Relay against a temp
  # RELAY_HOME, and reads the origin to trust out of the executable's own `/health` reply. Nothing
  # here touches a production key or the real database.
  #
  # Why a separate job instead of a step in `check`: SEA embeds the runtime of the machine doing
  # the build, so a Linux build produces an ELF named `.exe` that only fails once it reaches an
  # operator (see the header of `scripts/build-relay-executable.ts`). `check` has to run on a
  # Linux runner with Docker because it needs the Postgres service. So the two cannot
  # share a runner.
  #
  # Why there is deliberately no `paths:` filter, even though the Windows job spends billed runner
  # minutes at the 2x Windows rate. The suite imports from `src/lib/crypto`, `src/lib/tickets` and
  # `src/lib/relay` — a change outside
  # `relay/` breaks it, which is exactly what F4 did. Narrowing the trigger to relay paths would
  # rebuild the blind spot this job was added to close.
  relay-executable:
    runs-on: windows-latest

    # Pull requests only, unlike `check`, which also runs on pushes to master. The post-merge push
    # run would be near-pure duplication: GitHub builds a `pull_request` event against the *merge
    # commit* — the PR head
    # already merged into the base — so the PR run has verified the exact tree master is about to
    # become. Running twice for one tree is the wrong place to spend runner capacity.
    #
    # Two residuals, stated rather than discovered later. A commit pushed straight to master skips
    # this job entirely; every change since #23 has arrived by pull request, so that path is
    # unusual, but it is not blocked. And if master advances between the PR run and the merge, the
    # merge commit tested was stale — a semantic conflict would reach master unverified by this
    # job. Both are cheap to close by deleting this condition if the trade ever stops being worth
    # it. F10 governs `check`'s triggers and is unaffected.
    if: github.event_name == 'pull_request'

    env:
      # `postinstall` runs `prisma generate`, which wants this variable to exist. The acceptance
      # suite itself never opens a database — it runs without `--env-file` at all.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The baked origin is a placeholder on purpose. The Relay never *calls* its web origin —
      # there is no outbound `fetch` in `relay/src` — it only compares the value against the
      # `Origin` header of each incoming call, and the suite reads the baked value back out of
      # `/health`. Measured 17 August 2026: 27/27 checks green with `https://ci.invalid`.
      #
      # Deliberately NOT the real Railway origin: a CI-built executable pointing at production is
      # an artifact that should not exist, and if one ever escaped the runner it would be
      # indistinguishable from a release build.
      - name: Build the Relay executable
        id: relay_build
        run: npm run relay:build -- --web-origin=https://ci.invalid --compatibility-floor=1

      # This is `relay:verify` — the step the release checklist asks a human to remember. It is a
      # machine's job from here. Both paths are explicit: the verifier must never pick up an old
      # archive or sidecar left in a runner workspace.
      - name: Verify the explicit Relay archive, metadata, and restart replay
        id: relay_verify
        if: always()
        continue-on-error: true
        run: npm run relay:verify -- --archive=relay/dist/MKTTool-Relay.zip --metadata=relay/dist/MKTTool-Relay.metadata.json

      - name: Record Relay gate status
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.relay_build.outcome }}
          VERIFY_OUTCOME: ${{ steps.relay_verify.outcome }}
        shell: pwsh
        run: |
          if ($env:VERIFY_OUTCOME -eq 'success') {
            node scripts/ci/gate-status.cjs --gate=relay-archive-replay --status=PASS --reason='Explicit archive and metadata binding plus packaged restart replay passed.' --owner=mkttool-ci
          } else {
            node scripts/ci/gate-status.cjs --gate=relay-archive-replay --status=FAIL --reason="Relay build outcome: $env:BUILD_OUTCOME; explicit archive/metadata/replay outcome: $env:VERIFY_OUTCOME." --owner=mkttool-ci
          }

  # Confirm the merge actually reached production (C38).
  #
  # Railway deploys from master, so merging is deploying — and until now nothing checked whether
  # the deploy worked. On 17 August two of five deploys failed. One was C23 and was noticed because
  # production broke visibly. The other was PR #27's, and it went unseen for nine hours: it carried
  # `RELAY_VERSION = 12 -> 13`, which drives both the "your Relay is outdated" prompt and the
  # download route, so Relay 13 was published while production still served and advertised 12.
  #
  # **Do not simplify this to "look for a failure status."** Railway posted `in_progress` for that
  # deployment and then never posted anything again — no failure, no success. A check for an
  # explicit failure state would have called it fine, which is the exact defect this whole class of
  # findings is about. Success is the only thing that counts as success; everything else, including
  # silence and including no deployment at all, is a failure here.
  #
  # Proven in both directions before being committed, against real history: 141cde3 (#28, deployed)
  # passes, 6bf3985 (#27, the silent failure) fails and names the stuck-in_progress signature.
  #
  # Needs no secrets — Railway's GitHub integration already publishes deployment status, so the
  # default token can read it. If this job starts failing with "no deployment was ever created",
  # suspect that integration rather than the build.
  deploy-verification:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      deployments: read

    steps:
      - name: Wait for the production deployment of this commit to succeed
        # GitHub-hosted Ubuntu runners ship the GitHub CLI (`gh`).
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Observed successful deploys take 1m28s to 1m55s. Ten minutes is roughly five times the
          # slowest, which is enough headroom that a red here means something real rather than a
          # busy builder.
          TIMEOUT_SECONDS: "600"
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          echo "Waiting for a production deployment of $SHA to reach success."

          while :; do
            # The `sha` filter needs the full 40-character SHA; a short one silently matches
            # nothing and reads as "never deployed". Found while testing this check.
            ids=$(gh api "repos/$REPO/deployments?sha=$SHA" --jq '.[].id' 2>/dev/null)

            for id in $ids; do
              states=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[].state' 2>/dev/null)
              if echo "$states" | grep -qx "success"; then
                echo "Deployment $id reports success."
                exit 0
              fi
              if echo "$states" | grep -qxE "failure|error"; then
                echo "::error::Deployment $id failed for $SHA. Production is still serving the previous image."
                exit 1
              fi
            done

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No production deployment of $SHA reached success within ${TIMEOUT_SECONDS}s."
              if [ -z "${ids:-}" ]; then
                echo "No deployment was ever created — check Railway's GitHub integration."
              else
                echo "A deployment exists but never left in_progress. States seen:"
                for id in $ids; do
                  echo "  $id: $(gh api "repos/$REPO/deployments/$id/statuses" --jq '[.[].state] | join(",")' 2>/dev/null)"
                done
              fi
              exit 1
            fi

            sleep 20
          done
