name: Secret scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan source, documentation, and evidence for high-confidence secrets
        run: node scripts/ci/secret-scan.cjs --root=plans --root=docs --root=src --root=relay --root=scripts --root=.github
